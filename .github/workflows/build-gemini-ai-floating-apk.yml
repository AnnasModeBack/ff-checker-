name: Build Gemini AI Floating APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
      JAVA_TOOL_OPTIONS: "-Xmx2560m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract Project ZIP if Present at Root
        run: |
          set -euo pipefail
          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            ZIP_FOUND=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP_FOUND" ] && unzip -tq "$ZIP_FOUND" >/dev/null 2>&1; then
              unzip -oq "$ZIP_FOUND" -d /tmp/repo_zip_extract
              if [ -f "/tmp/repo_zip_extract/app/build.gradle" ] || [ -f "/tmp/repo_zip_extract/app/build.gradle.kts" ]; then
                cp -rn /tmp/repo_zip_extract/* . 2>/dev/null || true
                cp -rn /tmp/repo_zip_extract/.gitignore . 2>/dev/null || true
              else
                SUB_DIR=$(find /tmp/repo_zip_extract -maxdepth 2 \( -name "build.gradle" -o -name "build.gradle.kts" \) -printf "%h\n" | head -n 1 || true)
                if [ -n "$SUB_DIR" ]; then
                  cp -rn "$SUB_DIR"/* . 2>/dev/null || true
                  cp -rn "$SUB_DIR"/.gitignore . 2>/dev/null || true
                fi
              fi
              rm -rf /tmp/repo_zip_extract
            fi
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Android SDK
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: /tmp/android-sdk
          key: android-sdk-35-gemini-ai-floating-v8

      - name: Install Android SDK Command-Line Tools
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          ZIP_FILE="/tmp/commandlinetools-linux.zip"
          URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          for attempt in 1 2 3; do
            echo "Mengunduh Android Command-Line Tools (Percobaan $attempt/3)..."
            rm -f "$ZIP_FILE"
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 300 "$URL" -o "$ZIP_FILE"; then
              if unzip -tq "$ZIP_FILE" >/dev/null 2>&1; then
                break
              fi
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
          rm -rf /tmp/cmdtools_extract
          mkdir -p /tmp/cmdtools_extract
          unzip -oq "$ZIP_FILE" -d /tmp/cmdtools_extract
          mv /tmp/cmdtools_extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          rm -rf /tmp/cmdtools_extract "$ZIP_FILE"

      - name: Install Android Platform & Build-Tools 35
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9 & Build Signed-Ready Universal APK
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          if ! command -v gradle >/dev/null 2>&1 && [ ! -f "./gradlew" ]; then
            curl -fL "https://services.gradle.org/distributions/gradle-8.9-bin.zip" -o /tmp/gradle-8.9.zip
            unzip -oq /tmp/gradle-8.9.zip -d /tmp
            export PATH="/tmp/gradle-8.9/bin:$PATH"
          fi
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          if [ -f "./gradlew" ]; then
            sed -i 's/\r$//' gradlew
            sed -i 's/DEFAULT_JVM_OPTS=.*$/DEFAULT_JVM_OPTS="-Xmx2048m -Dfile.encoding=UTF-8"/' gradlew
            chmod +x ./gradlew
          fi
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect & Rename Built Gemini AI Floating APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "dist/Gemini-AI-Floating-v8-Debug.apk"
          fi
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp "app/build/outputs/apk/release/app-release-unsigned.apk" "dist/Gemini-AI-Floating-v8-Release-Unsigned.apk"
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "dist/Gemini-AI-Floating-v8-Release.apk"
          fi
          find app/build/outputs/apk -name "*.apk" -exec cp -n {} dist/ \; || true
          ls -lh dist/

      - name: Upload Gemini AI Floating APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-AI-Floating-APK
          path: dist/*.apk
          if-no-files-found: error
