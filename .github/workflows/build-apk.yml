name: Build Annas AI 3D Java APK v8

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Auto-Extract Latest Project ZIP if Present at Root
        run: |
          set -euo pipefail
          ZIP_FOUND=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FOUND" ] && unzip -tq "$ZIP_FOUND" >/dev/null 2>&1; then
            echo "Extracting project files from $ZIP_FOUND while preserving ZIP..."
            rm -rf /tmp/repo_zip_extract && mkdir -p /tmp/repo_zip_extract
            unzip -oq "$ZIP_FOUND" -d /tmp/repo_zip_extract
            APP_GRADLE=$(find /tmp/repo_zip_extract -name "build.gradle" -path "*/app/build.gradle" | head -n 1 || true)
            if [ -n "$APP_GRADLE" ]; then
              PROJ_ROOT=$(dirname "$(dirname "$APP_GRADLE")")
              echo "Found Android project root at: $PROJ_ROOT"
              cp -rf "$PROJ_ROOT"/app .
              cp -f "$PROJ_ROOT"/build.gradle . 2>/dev/null || true
              cp -f "$PROJ_ROOT"/settings.gradle . 2>/dev/null || true
              cp -f "$PROJ_ROOT"/gradle.properties . 2>/dev/null || true
              cp -f "$PROJ_ROOT"/README.md . 2>/dev/null || true
            else
              echo "ERROR: app/build.gradle not found inside $ZIP_FOUND"
              find /tmp/repo_zip_extract -maxdepth 4
              exit 1
            fi
          fi
          echo "=== Root directory contents before Gradle build ==="
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Check APK Size
        run: ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Annas-AI-3D-Java-v8
          path: app/build/outputs/apk/debug/*.apk
