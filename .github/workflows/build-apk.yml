name: Build Annas Tools APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Normalize Project Directory Structure
        run: |
          if [ ! -f "settings.gradle" ]; then
            FOUND_DIR=$(find . -maxdepth 3 -name "settings.gradle" -printf "%h\n" | head -n 1)
            if [ -n "$FOUND_DIR" ] && [ "$FOUND_DIR" != "." ]; then
              echo "Memindahkan isi $FOUND_DIR ke root repositori..."
              cp -r "$FOUND_DIR"/. .
            else
              echo "ERROR: File settings.gradle tidak ditemukan di repositori! Pastikan seluruh file proyek sudah di-upload."
              ls -la
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Launcher Icons from assets/icon.jpg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          chmod +x scripts/make-icons.sh
          bash scripts/make-icons.sh

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Generate Release Signing Keystore
        run: |
          if [ ! -f "app/annas-release.jks" ]; then
            keytool -genkeypair -v \
              -keystore app/annas-release.jks \
              -alias annastools \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass annastools2026 \
              -keypass annastools2026 \
              -dname "CN=Annas Tools, OU=RPL, O=Annas, L=Kerumutan, ST=Riau, C=ID"
          fi

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Annas-Tools.apk and Annas-Tools.zip
        run: |
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "APK tidak ditemukan!"
            exit 1
          fi
          cp "$APK_SOURCE" Annas-Tools.apk
          zip -j Annas-Tools.zip Annas-Tools.apk
          ls -lh Annas-Tools.apk Annas-Tools.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Annas-Tools-Release
          path: |
            Annas-Tools.zip
            Annas-Tools.apk
          retention-days: 30
