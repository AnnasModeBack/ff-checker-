name: Build AI Floating Solver APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Source Project ZIP Cleanly
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -q ai-floating-solver-project.zip -d extracted_project
          if [ -f "extracted_project/gradlew" ]; then
            PROJECT_ROOT="extracted_project"
          elif [ -f "extracted_project/ai-floating-solver-project/gradlew" ]; then
            PROJECT_ROOT="extracted_project/ai-floating-solver-project"
          else
            PROJECT_ROOT=$(find extracted_project -maxdepth 3 -name "gradlew" -exec dirname {} \; | head -n 1)
          fi
          if [ -z "$PROJECT_ROOT" ]; then
            echo "Error: Could not locate Android project root containing gradlew."
            exit 1
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: extracted_project/**/*.gradle*

      - name: Provision Gradle Wrapper JAR if Missing
        run: |
          cd "$PROJECT_ROOT"
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p gradle/wrapper
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar || true
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-floating-solver-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
