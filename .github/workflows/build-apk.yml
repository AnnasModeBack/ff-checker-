name: Build Annas AI Floating APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract Latest Project ZIP if Present at Root
        run: |
          set -euo pipefail
          ZIP_FOUND=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FOUND" ] && unzip -tq "$ZIP_FOUND" >/dev/null 2>&1; then
            echo "Extracting and overwriting project files from $ZIP_FOUND..."
            rm -rf /tmp/repo_zip_extract && mkdir -p /tmp/repo_zip_extract
            unzip -oq "$ZIP_FOUND" -d /tmp/repo_zip_extract
            if [ -f "/tmp/repo_zip_extract/app/build.gradle.kts" ]; then
              cp -rf /tmp/repo_zip_extract/* . 2>/dev/null || true
            else
              SUB_DIR=$(find /tmp/repo_zip_extract -maxdepth 2 -name "build.gradle.kts" -printf "%h\n" | head -n 1 || true)
              if [ -n "$SUB_DIR" ]; then
                cp -rf "$SUB_DIR"/* . 2>/dev/null || true
              fi
            fi
            rm -rf /tmp/repo_zip_extract
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /tmp/android-sdk
          key: android-sdk-35-annas-v13

      - name: Install Android SDK Platform 35 & Build Tools
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT=/tmp/android-sdk
          export ANDROID_HOME=/tmp/android-sdk
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_ZIP="/tmp/cmdline-tools.zip"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$CMDLINE_ZIP"
            unzip -q "$CMDLINE_ZIP" -d /tmp/cmdline-extract
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-extract/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-extract "$CMDLINE_ZIP"
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9 (Without Wrapper Jar Dependency)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: false

      - name: Build Debug & Release APKs
        env:
          ANDROID_SDK_ROOT: /tmp/android-sdk
          ANDROID_HOME: /tmp/android-sdk
        run: |
          set -euo pipefail
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          rm -rf /tmp/apk_out && mkdir -p /tmp/apk_out
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1 || true)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1 || true)
          [ -n "$DEBUG_APK" ] && cp "$DEBUG_APK" /tmp/apk_out/Annas-AI-Floating-v13-Debug.apk
          [ -n "$RELEASE_APK" ] && cp "$RELEASE_APK" /tmp/apk_out/Annas-AI-Floating-v13-Release.apk
          ls -lh /tmp/apk_out

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Annas-AI-Floating-APK
          path: /tmp/apk_out/*.apk
          if-no-files-found: error
