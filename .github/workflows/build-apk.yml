name: Build Annas AI 3D Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Extract Latest Project ZIP if Present at Root
        run: |
          set -euo pipefail
          ZIP_FOUND=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FOUND" ] && unzip -tq "$ZIP_FOUND" >/dev/null 2>&1; then
            echo "Extracting and overwriting project files from $ZIP_FOUND..."
            rm -rf /tmp/repo_zip_extract && mkdir -p /tmp/repo_zip_extract
            unzip -oq "$ZIP_FOUND" -d /tmp/repo_zip_extract
            if [ -f "/tmp/repo_zip_extract/app/build.gradle.kts" ]; then
              cp -rf /tmp/repo_zip_extract/* . 2>/dev/null || true
            else
              SUBDIR=$(find /tmp/repo_zip_extract -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)
              if [ -n "$SUBDIR" ] && [ -f "$SUBDIR/app/build.gradle.kts" ]; then
                cp -rf "$SUBDIR"/* . 2>/dev/null || true
              fi
            fi
            ls -lh "$ZIP_FOUND"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (Cache Disabled for Reliability)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Annas-AI-3D-HD-v4
          path: app/build/outputs/apk/debug/*.apk
