name: Build Universal APK v13.0 (0s Instant)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
      JAVA_TOOL_OPTIONS: "-Xmx2560m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract Project ZIP if Present at Root
        run: |
          set -euo pipefail
          if [ ! -f "app/build.gradle" ]; then
            ZIP_FOUND=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP_FOUND" ] && unzip -tq "$ZIP_FOUND" >/dev/null 2>&1; then
              echo "Mengekstrak $ZIP_FOUND..."
              unzip -oq "$ZIP_FOUND" -d /tmp/repo_zip_extract
              if [ -f "/tmp/repo_zip_extract/app/build.gradle" ]; then
                cp -rn /tmp/repo_zip_extract/* . 2>/dev/null || true
                cp -rn /tmp/repo_zip_extract/.gitignore . 2>/dev/null || true
              else
                SUB_DIR=$(find /tmp/repo_zip_extract -maxdepth 2 -name "build.gradle" -printf "%h\n" | head -n 1 || true)
                if [ -n "$SUB_DIR" ]; then
                  cp -rn "$SUB_DIR"/* . 2>/dev/null || true
                  cp -rn "$SUB_DIR"/.gitignore . 2>/dev/null || true
                fi
              fi
              rm -rf /tmp/repo_zip_extract
            fi
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Android SDK
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: /tmp/android-sdk
          key: android-sdk-35-cmd11076708-v4

      - name: Install & Verify Android SDK Command-Line Tools
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          ZIP_FILE="/tmp/commandlinetools-linux.zip"
          URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

          for attempt in 1 2 3; do
            rm -f "$ZIP_FILE"
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 300 "$URL" -o "$ZIP_FILE"; then
              if unzip -tq "$ZIP_FILE" >/dev/null 2>&1; then
                break
              fi
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done

          rm -rf /tmp/cmdtools_extract
          mkdir -p /tmp/cmdtools_extract
          unzip -oq "$ZIP_FILE" -d /tmp/cmdtools_extract
          mv /tmp/cmdtools_extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          rm -rf /tmp/cmdtools_extract "$ZIP_FILE"

      - name: Install Android Platform & Build-Tools 35
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Launcher Icons
        run: |
          set -euo pipefail
          mkdir -p scripts
          if [ ! -f "scripts/make-icons.sh" ]; then
            cat << 'EOF' > scripts/make-icons.sh
#!/usr/bin/env bash
set -e
python3 - << 'PY'
import os
from PIL import Image
src = "app/src/main/assets/icon.jpg"
res = "app/src/main/res"
sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
if os.path.exists(src):
    im = Image.open(src).convert("RGBA")
    for folder, px in sizes.items():
        out_dir = os.path.join(res, folder)
        os.makedirs(out_dir, exist_ok=True)
        resized = im.resize((px, px), Image.Resampling.LANCZOS)
        resized.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")
        resized.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")
PY
EOF
          fi
          chmod +x scripts/make-icons.sh
          ./scripts/make-icons.sh

      - name: Setup Gradle Wrapper & Build Universal APK
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type all
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect Built APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnnasTools-FloatingAI-v13.0-0s-APK
          path: dist/*.apk
          if-no-files-found: error
