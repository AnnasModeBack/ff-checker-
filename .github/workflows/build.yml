name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Ekstrak zip jika proyek diunggah dalam bentuk zip
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -o "$z"; done
      - name: Build APK
        run: |
          cd "$(dirname "$(find . -name settings.gradle | head -1)")"
          gradle assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/FFChecker.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FFChecker-apk
          path: out/FFChecker.apk
          
